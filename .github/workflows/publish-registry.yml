name: Publish to MCP Registry

# The Registry keeps every version immutable: publish server.json only when main
# carries a version the Registry does not have yet.
on:
  push:
    branches: [main]
    paths: [server.json]

permissions: {}

concurrency:
  group: publish-registry
  cancel-in-progress: false

env:
  REGISTRY_URL: https://registry.modelcontextprotocol.io
  # Bump both together; the digest is in the release's registry_<version>_checksums.txt.
  MCP_PUBLISHER_VERSION: 1.8.1
  MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  version:
    name: Check published version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: check
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          status=$(curl -sS --retry 3 -o /dev/null -w '%{http_code}' \
            "$REGISTRY_URL/v0.1/servers/${name//\//%2F}/versions/$version")
          case "$status" in
            200) published=true ;;
            404) published=false ;;
            *) echo "::error::The Registry answered $status for $name $version"; exit 1 ;;
          esac
          echo "$name $version published: $published"
          echo "published=$published" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: [validate, version]
    if: needs.version.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: registry
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        run: |
          archive="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/v$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" mcp-publisher

      # The domain namespace (online.patroltech/*) needs the key whose public half is
      # served at https://patroltech.online/.well-known/mcp-registry-auth.
      - name: Log in to the Registry
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          "$RUNNER_TEMP/mcp-publisher" login http --registry "$REGISTRY_URL" \
            --domain patroltech.online --private-key "$MCP_REGISTRY_PRIVATE_KEY"

      - name: Publish server.json
        run: '"$RUNNER_TEMP/mcp-publisher" publish server.json'

      - name: Confirm the new version is the latest
        run: |
          name=$(jq -r .name server.json)
          version=$(jq -r .version server.json)
          latest=$(curl -fsS --retry 3 "$REGISTRY_URL/v0.1/servers/${name//\//%2F}/versions/latest")
          jq -e --arg version "$version" \
            '.server.version == $version and ._meta["io.modelcontextprotocol.registry/official"].status == "active"' \
            <<< "$latest"
